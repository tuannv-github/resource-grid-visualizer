logLevel: info

rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889

hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsAllowOrigins: ["*"]
webrtcAllowOrigins: ["*"]

webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcHandshakeTimeout: 30s

webrtcIPsFromInterfaces: true

pathDefaults:
  source: publisher

# RX + NAI stack: backend-rx publishes live_rx, backend-nai publishes live_nai.
# live_nai_yolo is published by the deepstream-yolov13 service
# (yolo/docker-compose.yaml) which pulls live_nai, runs YOLOv13 inference,
# and pushes the annotated stream back here.
paths:
  live_rx:
  live_nai:
  live_nai_yolo:
