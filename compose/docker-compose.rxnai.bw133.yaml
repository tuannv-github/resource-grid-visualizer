# RX + NAI stack (133 PRB): MediaMTX (live_rx / live_nai) + two FastAPI backends (:8082 RX, :8083 NAI) + Vite frontend.
#
# Env file (required for LAN WebRTC video): copy and edit host IP
#   cp compose/.env.example compose/.env
# Run from resource-grid-visualizer/:
#   docker compose -f compose/docker-compose.rxnai.bw133.yaml up
# Or from compose/ (`.env` in cwd):
#   docker compose -f docker-compose.rxnai.bw133.yaml up
#
# Set MTX_WEBRTC_ADDITIONAL_HOSTS in compose/.env to this machine's LAN IP (as browsers reach it).
#
# POSIX mq: /resgrid_rx (RX), /resgrid_nai_in (cuBB→sionna), /resgrid_nai_out (sionna→plotter). `ipc: host` on backends + cuBB.
# cuPHY: CUPHY_RX_MQ_ENABLE + CUPHY_RX_MQ_PATH; CUPHY_NAI_MQ_ENABLE + CUPHY_NAI_MQ_PATH (NAIF in).
# nai-sionna: CUPHY_NAI_MQ_PATH in, CUPHY_NAI_MQ_OUT_PATH out. Match CUPHY_RESGRID_PRB = 133 (or CUDA_IQ_PRB).

include:
  - ../mediamtx/docker-compose.rxnai.yml

x-env-file: &env_file
  - .env

services:
  backend-rx:
    env_file: *env_file
    ipc: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      msgqueue:
        soft: 16777216
        hard: 16777216
    build:
      context: ..
      dockerfile: backend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 32g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    memswap_limit: 32g
    entrypoint:
      - uvicorn
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      MTX_RTSP_URL: rtsp://mediamtx:8554/live_rx
      MTX_WAIT_HOST: mediamtx
      MTX_WAIT_PORT: "8554"
      AUTO_START: ${AUTO_START_RX:-1}
      CUDA_AUTO_START_IQ_GENERATOR: ${CUDA_AUTO_START_IQ_GENERATOR:-0}
      GENERATION_MODE: ${GENERATION_MODE:-SYNTHETIC_FAPI}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-nvenc}
      CUDA_IQ_FPS: ${CUDA_IQ_FPS:-24}
      CUDA_IQ_CELL_PIXELS: ${CUDA_IQ_CELL_PIXELS:-6}
      CUDA_IQ_PRESET: ${CUDA_IQ_PRESET:-p4}
      CUDA_IQ_PRB: ${CUDA_IQ_PRB:-133}
      CUDA_IQ_SYMBOLS: ${CUDA_IQ_SYMBOLS:-14}
      CUPHY_RX_MQ_PATH: ${CUPHY_RX_MQ_PATH:-/resgrid_rx}
      CUDA_IQ_MQ_PATH: ${CUPHY_RX_MQ_PATH:-/resgrid_rx}
      CUDA_IQ_GEN_FPS: ${CUDA_IQ_GEN_FPS:-200}
      CUDA_SLOT_MQ_PATH: ${CUDA_SLOT_MQ_PATH_RX:-/resgrid_rx_slot}
      RESGRID_MQ_IMAGES: ${RESGRID_MQ_IMAGES_RX:-/resgrid_rx_rgba}
      RESGRID_CAPTURER_DIR: ${RESGRID_CAPTURER_DIR_RX:-/encoder-snaps-rx}
      MTX_PUBLIC_HTTP_BASE: ${MTX_PUBLIC_HTTP_BASE:-http://localhost:8888}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_FILE: ${LOG_FILE_RX:-/app/logs/server_rx.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
      LOG_ROTATE_WHEN: ${LOG_ROTATE_WHEN:-}
      LOG_ROTATE_INTERVAL: ${LOG_ROTATE_INTERVAL:-1}
      LOG_ROTATE_UTC: ${LOG_ROTATE_UTC:-0}
    depends_on:
      mediamtx:
        condition: service_started
    ports:
      - "8082:8081"
    volumes:
      - ${RESGRID_HOST_TMP:-../host-tmp}:/tmp
      - ${RESGRID_HOST_CAPTURER_SNAPS_RX:-../encoder-snaps-rx}:/encoder-snaps
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../backend/logs:/app/logs
    command:
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --reload
      - --reload-dir
      - /app/app
    develop:
      watch:
        - action: rebuild
          path: ../backend/Dockerfile
        - action: rebuild
          path: ../backend/requirements.txt
        - action: rebuild
          path: ../backend/plotter/CMakeLists.txt
        - action: rebuild
          path: ../backend/plotter/src
        - action: rebuild
          path: ../backend/plotter/include/plotter_common.cuh
        - action: rebuild
          path: ../backend/plotter/include/viridis_lut.inc

  backend-nai:
    env_file: *env_file
    ipc: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      msgqueue:
        soft: 16777216
        hard: 16777216
    build:
      context: ..
      dockerfile: backend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 32g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    memswap_limit: 32g
    entrypoint:
      - uvicorn
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      MTX_RTSP_URL: rtsp://mediamtx:8554/live_nai
      MTX_WAIT_HOST: mediamtx
      MTX_WAIT_PORT: "8554"
      AUTO_START: ${AUTO_START:-0}
      CUDA_AUTO_START_IQ_GENERATOR: ${CUDA_AUTO_START_IQ_GENERATOR:-0}
      GENERATION_MODE: ${GENERATION_MODE:-SYNTHETIC_FAPI}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-nvenc}
      CUDA_IQ_FPS: ${CUDA_IQ_FPS:-24}
      CUDA_IQ_CELL_PIXELS: ${CUDA_IQ_CELL_PIXELS:-6}
      CUDA_IQ_PRESET: ${CUDA_IQ_PRESET:-p4}
      CUDA_IQ_PRB: ${CUDA_IQ_PRB:-133}
      CUDA_IQ_SYMBOLS: ${CUDA_IQ_SYMBOLS:-14}
      CUPHY_NAI_MQ_OUT_PATH: ${CUPHY_NAI_MQ_OUT_PATH:-/resgrid_nai_out}
      CUDA_IQ_MQ_PATH: ${CUPHY_NAI_MQ_OUT_PATH:-/resgrid_nai_out}
      CUDA_IQ_GEN_FPS: ${CUDA_IQ_GEN_FPS:-200}
      CUDA_SLOT_MQ_PATH: ${CUDA_SLOT_MQ_PATH_NAI:-/resgrid_nai_slot}
      RESGRID_MQ_IMAGES: ${RESGRID_MQ_IMAGES_NAI:-/resgrid_nai_rgba}
      RESGRID_CAPTURER_DIR: ${RESGRID_CAPTURER_DIR_NAI:-/encoder-snaps-nai}
      MTX_PUBLIC_HTTP_BASE: ${MTX_PUBLIC_HTTP_BASE:-http://localhost:8888}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_FILE: ${LOG_FILE_NAI:-/app/logs/server_nai.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
      LOG_ROTATE_WHEN: ${LOG_ROTATE_WHEN:-}
      LOG_ROTATE_INTERVAL: ${LOG_ROTATE_INTERVAL:-1}
      LOG_ROTATE_UTC: ${LOG_ROTATE_UTC:-0}
    depends_on:
      mediamtx:
        condition: service_started
    ports:
      - "8083:8081"
    volumes:
      - ${RESGRID_HOST_TMP:-../host-tmp}:/tmp
      - ${RESGRID_HOST_CAPTURER_SNAPS_NAI:-../encoder-snaps-nai}:/encoder-snaps
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../backend/logs:/app/logs
    command:
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --reload
      - --reload-dir
      - /app/app
    develop:
      watch:
        - action: rebuild
          path: ../backend/Dockerfile
        - action: rebuild
          path: ../backend/requirements.txt
        - action: rebuild
          path: ../backend/plotter/CMakeLists.txt
        - action: rebuild
          path: ../backend/plotter/src
        - action: rebuild
          path: ../backend/plotter/include/plotter_common.cuh
        - action: rebuild
          path: ../backend/plotter/include/viridis_lut.inc

  frontend:
    env_file: *env_file
    image: resouce-grid-frontend-vite-rxnai
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    deploy:
      resources:
        limits:
          memory: 8g
    memswap_limit: 8g
    environment:
      VITE_PLAYBACK_MODE: ${VITE_PLAYBACK_MODE:-webrtc}
      VITE_API_RELATIVE: "0"
      VITE_DEV_PROXY_TARGET: ""
      VITE_API_BASE_RX: ${VITE_API_BASE_RX:-http://localhost:8082}
      VITE_API_BASE_NAI: ${VITE_API_BASE_NAI:-http://localhost:8083}
      VITE_GUI_MODE: ${VITE_GUI_MODE:-rxnai}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - resgrid_rxnai_frontend_node_modules:/app/node_modules
    depends_on:
      - mediamtx
      - backend-rx
      - backend-nai
    develop:
      watch:
        - action: rebuild
          path: ../frontend/Dockerfile.dev
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json

volumes:
  resgrid_rxnai_frontend_node_modules:
