# MediaMTX + backend + Vite frontend (bind mounts, HMR, uvicorn --reload).
# LAN: http://<host-ip>:5173 — open TCP 5173,8081,8888,8889 and 8189 tcp+udp for WebRTC (default playback).
# Frontend defaults to WebRTC (WHEP) for lowest latency; set VITE_PLAYBACK_MODE=hls for LL-HLS on :8888 only.
# WebRTC/WHEP: set MTX_WEBRTC_ADDITIONAL_HOSTS in `compose/.env` (see `compose/.env.example`).
#
# Encoder: VIDEO_ENCODER defaults to nvenc (h264_nvenc). Many datacenter GPUs (e.g. H100 per NVIDIA’s
# Video Encode / Decode GPU Support Matrix) have **no** NVENC — use VIDEO_ENCODER=cpu or you get OpenEncodeSessionEx errors.
# Backend requests an NVIDIA GPU for CUDA; NVENC is optional and GPU-family dependent. Prerequisites: proprietary driver +
# [NVIDIA Container Toolkit](https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html).
# Verify: `nvidia-smi` and `docker run --rm --gpus all nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi`
# If compose fails with "could not select device driver nvidia": `sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker`
# We use deploy.reservations.devices (driver: nvidia), not top-level `gpus: all` (avoids some CDI noise).
# No container swap: `memswap_limit` must equal `memory` — Docker’s total cap is RAM+swap; equal values ⇒ swap room is 0 (not “8g of swap”).
# CPU-only (no GPU): remove the `deploy:` block under `backend`, set `VIDEO_ENCODER=cpu`, drop NVIDIA_* env vars.
#
# Default generation mode is SYNTHETIC_FAPI (slot messages / resgrid_plotter --data-mode 3 + slot mq).
# AUTO_START defaults to 0 (idle on boot); set AUTO_START=1 to start the CUDA plotter (or FFmpeg when GENERATION_MODE=SYNTHETIC_IMAGES) after boot.
# generator.py is NOT started unless CUDA_AUTO_START_IQ_GENERATOR=1 (default 0); use the API/UI generator group.
# Override with GENERATION_MODE=SYNTHETIC_RESOURCE_GRID or SYNTHETIC_IMAGES. Historic SYNTHETIC_VIDEO / SYNTHETIC_IQ / SYNTHETIC_CHANNEL_BASED are still accepted by the server.
# SYNTHETIC_IMAGES: backend defaults RESGRID_MQ_IMAGES when unset (POST /api/generator/start + plotter --mq-images).
# Rebuild backend when changing `backend/plotter/`. `backend/scripts/` is bind-mounted below for live edits to the IQ/slot producers.
#
# If frontend logs show nginx (not Vite), the container is on an old image — run:
#   docker compose rm -sf frontend && docker compose build --no-cache frontend && docker compose up -d
#
# Ports: 8888 HLS, 8889 WHEP/WHIP (HTTP), 8189/tcp+udp WebRTC ICE, 8081 API, 5173 UI, 8554 RTSP.
#
# POSIX mqueues (kernel names; defaults /resgrid_slot, /resgrid_iq, /resgrid_rgba).
# `ipc: host` uses the host IPC namespace so host processes (e.g. cuPHY/cuBB) open the same mq names as the plotter.
# Bind-mount host dir `host-tmp/` onto /tmp via RESGRID_HOST_TMP for FIFOs/files; mq names are not files under /tmp.
#
# File capturer (JPEG): host dir `encoder-snaps/` → container /encoder-snaps via RESGRID_HOST_CAPTURER_SNAPS
# (default ../encoder-snaps); RESGRID_CAPTURER_DIR defaults to /encoder-snaps. Restart the plotter after changing.
#
#   docker compose watch

include:
  - ../mediamtx/docker-compose.yml

services:
  backend:
    # Host IPC: same POSIX mq namespace as cuPHY/cuBB on the **host**. If cuBB runs **in Docker**, add `ipc: host`
    # (or `ipc: "service:backend"`) to **that** service too — default container IPC is isolated from the host.
    ipc: host
    build:
      context: ..
      dockerfile: backend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 32g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    memswap_limit: 32g
    # Override base image ENTRYPOINT (ffmpeg) so this process is uvicorn, not ffmpeg + these args.
    entrypoint:
      - uvicorn
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      MTX_RTSP_URL: rtsp://mediamtx:8554/live
      MTX_WAIT_HOST: mediamtx
      MTX_WAIT_PORT: "8554"
      AUTO_START: ${AUTO_START:-0}
      # Plotter only on boot; set to 1 to also spawn generator.py with CUDA.
      CUDA_AUTO_START_IQ_GENERATOR: ${CUDA_AUTO_START_IQ_GENERATOR:-0}
      GENERATION_MODE: ${GENERATION_MODE:-SYNTHETIC_FAPI}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-nvenc}
      # NVENC / stdin pacing (~encoder output). Default 24 Hz; lower than CUDA_IQ_GEN_FPS exercises drop-oldest queues under load.
      CUDA_IQ_FPS: ${CUDA_IQ_FPS:-24}
      CUDA_IQ_CELL_PIXELS: ${CUDA_IQ_CELL_PIXELS:-6}
      CUDA_IQ_PRESET: ${CUDA_IQ_PRESET:-p4}
      CUDA_IQ_PRB: ${CUDA_IQ_PRB:-273}
      CUDA_IQ_SYMBOLS: ${CUDA_IQ_SYMBOLS:-14}
      CUDA_IQ_MQ_PATH: ${CUDA_IQ_MQ_PATH:-/resgrid_iq}
      CUDA_IQ_GEN_FPS: ${CUDA_IQ_GEN_FPS:-200}
      CUDA_SLOT_MQ_PATH: ${CUDA_SLOT_MQ_PATH:-/resgrid_slot}
      RESGRID_MQ_IMAGES: ${RESGRID_MQ_IMAGES:-/resgrid_rgba}
      RESGRID_CAPTURER_DIR: ${RESGRID_CAPTURER_DIR:-/encoder-snaps}
      MTX_PUBLIC_HTTP_BASE: ${MTX_PUBLIC_HTTP_BASE:-http://localhost:8888}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_FILE: ${LOG_FILE:-/app/logs/server.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
      LOG_ROTATE_WHEN: ${LOG_ROTATE_WHEN:-}
      LOG_ROTATE_INTERVAL: ${LOG_ROTATE_INTERVAL:-1}
      LOG_ROTATE_UTC: ${LOG_ROTATE_UTC:-0}
    depends_on:
      mediamtx:
        condition: service_started
    ports:
      - "8081:8081"
    volumes:
      # resouce-grid/host-tmp → container /tmp (relative to this compose file). Same mount path on OAI gNB
      # (nws/docker-compose.oai*.yaml) may use CUDA_IQ_MQ_PATH_DL/UL to match dlul backends when applicable.
      - ${RESGRID_HOST_TMP:-../host-tmp}:/tmp
      - ${RESGRID_HOST_CAPTURER_SNAPS:-../encoder-snaps}:/encoder-snaps
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../backend/logs:/app/logs
    command:
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --reload
      - --reload-dir
      - /app/app
    develop:
      watch:
        - action: rebuild
          path: ../backend/Dockerfile
        - action: rebuild
          path: ../backend/requirements.txt
        - action: rebuild
          path: ../backend/plotter/CMakeLists.txt
        - action: rebuild
          path: ../backend/plotter/src
        - action: rebuild
          path: ../backend/plotter/include/plotter_common.cuh
        - action: rebuild
          path: ../backend/plotter/include/viridis_lut.inc

  frontend:
    # Distinct name avoids reusing an image built earlier from frontend/Dockerfile (nginx).
    image: resouce-grid-frontend-vite
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    deploy:
      resources:
        limits:
          memory: 8g
    memswap_limit: 8g
    # WebRTC (WHEP) default; use VITE_PLAYBACK_MODE=hls for LL-HLS on :8888 only (no ICE on 8189).
    environment:
      VITE_PLAYBACK_MODE: ${VITE_PLAYBACK_MODE:-webrtc}
      # Same-origin API + /docs via Vite proxy (LAN: use http://<host>:5173 only; avoids ERR_EMPTY_RESPONSE when :8081 is blocked).
      VITE_API_RELATIVE: "1"
      VITE_DEV_PROXY_TARGET: http://backend:8081
      # Optional GUI layout: VITE_GUI_COMBINE=1 forces one column; VITE_GUI_DLUL=1 forces two (needs both API bases).
      VITE_GUI_COMBINE: ${VITE_GUI_COMBINE:-}
      VITE_GUI_DLUL: ${VITE_GUI_DLUL:-}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - resgrid_frontend_node_modules:/app/node_modules
    depends_on:
      - mediamtx
      - backend
    develop:
      watch:
        - action: rebuild
          path: ../frontend/Dockerfile.dev
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json

volumes:
  resgrid_frontend_node_modules:
